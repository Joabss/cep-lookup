spring:
  application:
    name: cep-lookup

  datasource:
    url: jdbc:postgresql://localhost:5432/cepdb
    username: cepuser
    password: ceppass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: 8080
  servlet:
    context-path: /

# External CEP API - points to WireMock by default
# Change to https://viacep.com.br/ws for production
cep:
  api:
    base-url: http://localhost:8089/ws

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.challenge.ceplookup: DEBUG
    org.springframework.web.client: DEBUG
